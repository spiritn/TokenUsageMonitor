<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Monitor</title>
<style>
:root{color-scheme:dark;--bg:#101625;--panel:#192235;--line:#2b354c;--ink:#edf1fa;--muted:#aab5ca;--accent:#9c90ff;--good:#65d6ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:23px;letter-spacing:-.5px;margin:0}h2{font-size:14px;margin:0 0 15px}p{color:var(--muted);line-height:1.6}small{color:var(--muted);font-size:12px}button,select,input{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px;font:inherit}button{cursor:pointer}button.active{background:#6452cb;border-color:#9c90ff}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.controls select{min-width:130px;max-width:330px}.hero{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:20px 0}.metric{padding:20px 8px}.metric b{display:block;font-size:29px;font-variant-numeric:tabular-nums;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .right{text-align:right;white-space:nowrap}.name{overflow-wrap:anywhere}.badge{color:var(--good);font-size:12px}.warning{color:#ffcd80}.muted{color:var(--muted)}.chart{height:160px;display:flex;align-items:flex-end;gap:4px}.bar{background:var(--accent);min-width:2px;flex:1;border-radius:3px 3px 0 0}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}.empty{padding:18px 0;color:var(--muted)}#error{color:#ffcd80}details{margin-top:10px}summary{cursor:pointer;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.scroll{overflow:auto}.money{color:var(--muted);font-size:12px}footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}.metric b{font-size:24px}.controls select{max-width:100%;width:100%}}
.chart{display:grid;height:190px;align-items:stretch}.day-column{display:flex;flex-direction:column;min-width:0}.track{height:160px;display:flex;align-items:flex-end}.bar{flex:none;width:100%;min-width:0}.bar.zero{height:3px;background:#627087}.tick{text-align:center;font-size:10px;color:var(--muted);margin-top:8px;white-space:nowrap}.month-nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}.chart-note{margin-top:12px;display:block}.source-warning{display:block;color:#ffcd80;font-size:12px;margin-top:5px}
</style>
<main><header><h1>Token Monitor</h1><small id="updated">连接中</small></header><p>工具用量 · 本地记录</p>
<div class="controls"><button data-period="day" class="active">今日</button><button data-period="week">本周</button><button data-period="month">本月</button><button data-period="last_month">上月</button><select id="tool" aria-label="工具"><option value="">全部工具</option></select></div>
<div class="month-nav"><button id="prev-month">← 上一月</button><button id="next-month">下一月 →</button><small id="selection-status" role="status"></small></div><details><summary>自选日期</summary><div class="controls"><input id="start" type="date" aria-label="开始日期"><input id="end" type="date" aria-label="结束日期"><button id="history">查询</button><button id="reset">返回当前周期</button></div></details>
<div id="error" role="status"></div><div class="hero" id="hero"></div><details class="panel full" style="margin-bottom:16px"><summary>缓存明细</summary><div id="cache-detail"></div></details>
<div class="grid"><section class="panel full"><h2>Token 趋势 <small id="range"></small></h2><div id="chart"></div></section><section class="panel"><h2>工具与数据源</h2><div id="tools"></div></section><section class="panel"><h2>模型 / 供应商</h2><div id="models"></div></section><section class="panel"><h2>当前额度与账户快照</h2><small>不随历史日期或工具筛选变化；更新时间见各项。</small><div id="quota"></div></section><section class="panel full"><h2>最近用量记录</h2><div class="scroll"><table id="recent"></table></div></section></div>
<footer>总量仅包含已采集的本地记录。缓存已包含在输入中；推理子项不重复累加。<br>金额仅在配置价格表后估算；积分、订阅额度与 API 账单分开显示。千问仅覆盖 Agent 模式。</footer></main>
<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:2}).format(n);
let displayTimezone='Asia/Shanghai';
const date=t=>t?new Date(t).toLocaleString('zh-CN',{timeZone:displayTimezone,hour12:false}):'暂无';
const states={ready:'扫描正常',error:'读取异常',stale:'数据过期',no_source:'暂无日志',starting:'初始化',unsupported:'暂不支持'};
let period='day',historical=false,busy=false,queued=false;
function query(){const q=new URLSearchParams({period});if($('#tool').value)q.set('tool',$('#tool').value);if(historical){q.set('start',$('#start').value);q.set('end',$('#end').value)}return q.toString()}
function monthRange(step){
 const now=new Date().toLocaleDateString('sv-SE',{timeZone:displayTimezone});
 const anchor=historical&&$('#start').value?$('#start').value:now;
 const [year,month]=anchor.split('-').map(Number);
 const offset=step+(!historical&&period==='last_month'?-1:0);
 const first=new Date(Date.UTC(year,month-1+offset,1)),last=new Date(Date.UTC(year,month+offset,0));
 $('#start').value=first.toISOString().slice(0,10);$('#end').value=last.toISOString().slice(0,10);
 historical=true;document.querySelectorAll('[data-period]').forEach(b=>b.classList.remove('active'));load();
}
function row(name,value,sub=''){return `<div class="row"><div class="name">${esc(name)}${sub?'<br><small>'+esc(sub)+'</small>':''}</div><div class="right">${value}</div></div>`}
function costs(t){let a=Object.entries(t.costs||{}).map(([c,n])=>esc(c)+' '+n.toFixed(2)).join(' / ');return a?'约 '+a+(t.unknown_cost_calls?'（部分）':''):'费用未知'}
async function load(){if(busy){queued=true;return}busy=true;queued=false;const requested=query();const controller=new AbortController(),deadline=setTimeout(()=>controller.abort(),10000);$('#selection-status').textContent='正在加载所选范围…';try{

const res=await fetch('/api/v2/overview?'+requested,{signal:controller.signal});const d=await res.json();if(requested!==query())return;if(!res.ok)throw Error(d.error||'读取失败');displayTimezone=d.range.timezone;$('#selection-status').textContent='';document.querySelector('main>p').textContent=d.demo?'演示数据 · 不代表真实消费':'多工具用量 · 本地记录';$('#error').textContent='';$('#updated').textContent='更新 '+new Date().toLocaleTimeString('zh-CN');
const t=d.total;$('#hero').innerHTML=[['Token',fmt(t.tokens)],['会话',fmt(t.sessions)],['用量记录',fmt(t.calls)],['缓存命中',t.cache_hit_rate==null?'—':(t.cache_hit_rate*100).toFixed(2)+'%']].map(([k,v])=>`<div class="metric"><b>${v}</b><small>${k}</small></div>`).join('');const hit=t.cache_hit_rate==null?null:t.cache_hit_rate*100;$('#cache-detail').innerHTML=hit==null?'<div class="empty">当前数据源没有返回缓存字段，无法计算命中率。</div>':`<div class="hero" style="margin:0;border:0"><div class="metric"><b>${hit.toFixed(2)}%</b><small>缓存命中率</small></div><div class="metric"><b>${fmt(t.cache_read)}</b><small>命中 Token</small></div><div class="metric"><b>${fmt(t.cache_miss)}</b><small>未命中 Token</small></div><div class="metric"><b>${fmt(t.cache_known_input)}</b><small>提供缓存字段的输入</small></div></div><small>命中率只基于提供缓存字段的输入；覆盖 ${(t.cache_coverage*100).toFixed(1)}%。缓存已包含在输入 Token 中。</small>`;
$('#range').textContent=date(d.range.start).split(' ')[0]+' — '+date(d.range.end-1).split(' ')[0];
const max=Math.max(1,...d.trend.map(x=>x.tokens));$('#chart').innerHTML=`<div class="chart" style="grid-template-columns:repeat(${d.trend.length},minmax(0,1fr))">${d.trend.map((x,i)=>{const label=d.trend.length<=7?x.date.slice(5).replace('-','/'):String(Number(x.date.slice(-2)));const tick=d.trend.length<=7||i===0||i===d.trend.length-1||Number(x.date.slice(-2))%5===0;const title=x.date+'：'+x.tokens.toLocaleString()+' token'+(x.tokens===0?'（未采到用量）':'');return `<div class="day-column" tabindex="0" aria-label="${esc(title)}" title="${esc(title)}"><div class="track"><div class="bar ${x.tokens===0?'zero':''}" style="height:${x.tokens===0?'3px':Math.max(1,x.tokens/max*160)+'px'}"></div></div><div class="tick">${tick?label:'&nbsp;'}</div></div>`}).join('')}</div><small class="chart-note">灰线表示当天未采到用量；将鼠标移至日期可查看具体数值。</small>`;
const sourceCard=s=>{const a=d.tools[s.tool];return row(s.name,`<span class="${s.status==='ready'?'badge':'warning'}">${esc(states[s.status]||s.status)}</span><br>${a?fmt(a.tokens)+' tokens':(s.status==='ready'?'本范围未采到用量':'—')}${a?.credits!=null?'<br><small>'+a.credits.toFixed(2)+' 本地积分</small>':''}${a?'<br><span class="money">'+costs(a)+'</span>':''}`,s.coverage+'；最近扫描 '+date(s.last_scan)+'；最近有效用量 '+date(s.last_event)+(s.detail?'；'+s.detail:''))+(s.coverage_warning?'<span class="source-warning">'+esc(s.coverage_warning)+'</span>':'')};const primary=['claude','codex','workbuddy','qianwen'];$('#tools').innerHTML=d.sources.filter(s=>primary.includes(s.tool)).map(sourceCard).join('')+'<details><summary>其他来源与支持范围</summary>'+d.sources.filter(s=>!primary.includes(s.tool)).map(sourceCard).join('')+'</details>';

$('#models').innerHTML=Object.entries(d.models).map(([k,v])=>row(k,fmt(v.tokens),costs(v))).join('')+'<small>供应商</small>'+Object.entries(d.providers).map(([k,v])=>row(k,fmt(v.tokens))).join('');
$('#quota').innerHTML=d.quota.map(q=>{let v=`<small>Codex 账户额度快照 · ${date(q.ts)}（当前快照）</small>`;for(const k of ['primary','secondary']){const w=q.data[k];if(w)v+=row(k==='primary'?'短周期':'长周期',esc(w.used_percent)+'% 已用','重置 '+date(w.resets_at*1000))}return v}).join('');
$('#quota').innerHTML+=d.accounts.slice(0,1).map(a=>row('DeepSeek '+a.date,a.balance==null?'余额未知':'余额 ¥'+a.balance.toFixed(2),a.cost==null?'费用未知；余额变化不等于消费':'平台费用 ¥'+a.cost.toFixed(2))).join('');if(!$('#quota').innerHTML)$('#quota').innerHTML='<div class="empty">暂无账户快照</div>';
$('#recent').innerHTML='<thead><tr><th>时间</th><th>工具 / 模型</th><th>输入（含缓存）</th><th>输出</th><th>积分</th><th>来源</th></tr></thead><tbody>'+d.recent.map(r=>`<tr><td>${esc(date(r.ts))}</td><td>${esc(r.tool)}<br>${esc(r.model)}</td><td>${fmt(r.input_tokens)}</td><td>${fmt(r.output_tokens)}</td><td>${r.credits==null?'—':r.credits.toFixed(2)}</td><td>${r.basis==='response'?'响应记录':'累计差分'}</td></tr>`).join('')+'</tbody>';
const el=$('#tool'),v=el.value;el.innerHTML='<option value="">全部工具</option>'+d.sources.map(x=>`<option value="${esc(x.tool)}">${esc(x.name)}</option>`).join('');el.value=v;
}catch(e){if(requested===query()){$('#error').textContent='无法刷新：'+e.message+'。当前保留上次范围的数据。';$('#updated').textContent='连接异常';$('#selection-status').textContent='加载失败'}}finally{clearTimeout(deadline);busy=false;if(queued||requested!==query())load()}}
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;historical=false;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));load()});$('#tool').onchange=load;$('#history').onclick=()=>{if(!$('#start').value||!$('#end').value){$('#error').textContent='请选择开始和结束日期';return}historical=true;document.querySelectorAll('[data-period]').forEach(b=>b.classList.remove('active'));load()};$('#reset').onclick=()=>{historical=false;document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('active',b.dataset.period===period));load()};$('#prev-month').onclick=()=>monthRange(-1);$('#next-month').onclick=()=>monthRange(1);load();setInterval(load,5000);
</script></html>
